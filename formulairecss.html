<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription Nouveau Client - Méditerranée</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body bgcolor="pink">

    <form action="#" method="post">
    	<header>
        <h1>Inscription d'un Nouveau client</h1>
        </header>

<br> <br>
<br> <br>


        <section>
        	<form action="#" method="post"></form>
        	<table border="0" width="40%">

        <tr> <td> <label for="nom">Nom :</label> </td>
        <td> <input type="text" id="nom" name="nom">   </td> </tr> 
       	 <td> <label for="prenom">Prénom :</label>   </td> 
        <td>	<input type="text" id="prenom" name="prenom">  </td> </tr> 
			<td>	<label for="date_naissance">Date de naissance :</label>  </td>
	        <td> 	<input type="date" id="date_naissance" name="date_naissance"> </td> </tr>  
	      
	      <td>   	<label for="email">Adresse mail :</label> </td>
	       <td>  	<input type="email" id="email" name="email"> </td> </tr> 

	       <td>  	<label for="mdp">Mot de passe :</label> </td>
	      <td>  	<input type="password" id="mdp" name="mdp"> </td> </tr> 
	        <td> 	<label for="permis">Numéro fr permis :</label> </td>
	       <td> 	<input type="text" id="permis" name="permis"> </td> </tr> 

	        <td>	<label for="anciennete">Nombre d'années d'ancienneté :</label> </td>
	        <td>	<input type="number" id="anciennete" name="anciennete" min="0" max="80"> </td> </tr> 

	        	<tr> <td> <label for="ville">Ville : </label> 
	       		 <td> <select id="ville" name="ville"> 
	         		<option value="paris">Paris</option> 	        	 		<option value="versailles">Versaille</option>
	        	 			<option value="creteil">Créteil</option>
	        	 		</td> </tr>

	        	
	        		
	        	<tr> <td> <label for="adresse"> Adresse du client :</label> </td> 
	      <td>	<textarea id="adresse" id="adresse"  name="anciennete" rows="4" cols="30"></textarea> </td> </tr>

	     



	        	<tr> <td> <p>Situation matrimoniale :</p> </td> </tr>


	        	<tr> <td> <label for="marie_oui">Marié :</label> </td> <td>
	        	<input type="radio" id="marie_oui" name="marie" value="oui"> </td> </tr> 
	        	<tr> <td><label for="marie_non">Non marié :</label> </td> <td>
	        	<input type="radio" id="marie_non" name="marie" value="non"> </td> </tr>  

	    		<tr> <td> <p>Préférence de voiture :</p> </td> </tr>

	    		<tr> <td> <label for="pref_auto">Automatisé :</label> </td> 
	        	<td> <input type="checkbox" id="pref_auto" name="preference_auto" value="automatique">   </td> </tr>
 
	    		<tr> <td><label for="pref_manuelle">Manuelle :</label> </td> 
	        	 <td> <input type="checkbox" id="pref_mauelle" name="preference_manuelle" value="manuelle"> </td> </tr> 

	        	



	        	<tr> <td><button type="sumbit">Enregistrer</button> 

	        	 <button type="reset">Annuler</button> <br> <br> </td> </tr>

	        	</table>
	       
	        
	        	</select>

    </form>
