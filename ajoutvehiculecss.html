<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajout d'un Nouveau véhicule - Méditerranée</title>
    <link rel="stylesheet" href="style.css">
</head>

<body bgcolor="pink">

    <form action="#" method="post">
        <header>
        <h1>Ajout d'un Nouveau véhicule</h1>
        </header>

<br> <br>
<br> <br>


        <section>
            <table border="0" width="40%">

        <tr> <td> <label for="marque">Marque :</label> </td>
        <td> <select id="marque" name="marque">
            <option value="peugeot">Peugeot</option>
            
    <option value="mercedes">Mercedes</option>
        

        <option value="renault">Renault</option>

        </select> </td> </tr>

        <tr> <td> <label for="immatriculation">Immatriculation :</label> </td>
        <td> <input type="text" id="immatriculation" name="immatriculation">  </td> </tr>

        <tr> <td> <label for="couleur">Couleur :</label> </td>
        <td> <input type="text" id="couleur" name="couleur"> </td> </tr>



        <tr> <td> <label for="date_immatriculation">Date d'immatriculation :</label> </td>
        <td> <input type="date" id="date_immatriculation" name="date_immatriculation">  </td> </tr>





        <tr> <td> <label for="kilometrage">Kilométrage :</label> </td>
        <td> <input type="number" id="kilometrage" name="kilometrage"> <br> <br> </td> </tr>



        <tr> <td> <label>État :</label> </td>
        <td>


        <input type="radio" id="occasion" name="etat" value="occasion">
        <label for="occasion">Occasion</label>



        <input type="radio" id="neuf" name="etat" value="neuf">
        <label for="neuf">Neuf</label>
        <br> <br>
        </td> </tr>


        <tr> <td> <label>Carburant :</label> </td>
        <td>



        <input type="radio" id="hybride" name="carburant" value="hybride">
        <label for="hybride">Hybride</label>



        <input type="radio" id="electrique" name="carburant" value="electrique">
        <label for="electrique">Électrique</label>




        <input type="radio" id="diesel" name="carburant" value="diesel">
        <label for="diesel">Diesel</label>




        <input type="radio" id="essence" name="carburant" value="essence">
        <label for="essence">Essence</label>
        <br> <br>
        </td> </tr>




        <tr> <td> <label for="boite">Boîte de vitesses :</label> </td>
        <td> <select id="boite" name="boite">
        <option value="manuelle">Manuelle</option>
        <option value="automatique">Automatique</option>
        </select> <br> <br> </td> </tr>






        <tr> <td> <label for="portes">Nombre de portes :</label> </td>
        <td> <input type="number" id="portes" name="portes" min="2" max="5"> <br> <br> </td> </tr>





        <tr> <td> <label for="controle_technique">Date du dernier contrôle technique :</label> </td>
        <td> <input type="date" id="controle_technique" name="controle_technique"> <br> <br> </td> </tr>







        <tr> <td> <label for="kilometrage_max">Kilométrage maximum autorisé :</label> </td>
        <td> <input type="number" id="kilometrage_max" name="kilometrage_max"> <br> <br> </td> </tr>

        <tr> <td> <button type="submit">Enregistrer</button>
        <button type="reset">Annuler</button> <br> <br> </td> </tr>

        </table>

        <footer>
        <p>&copy; 2026 Agence Méditerranée - Location de véhicules</p>
        </footer>

    </form>
<a href="projet8.html"> Retour </a>

</body>
</html>
